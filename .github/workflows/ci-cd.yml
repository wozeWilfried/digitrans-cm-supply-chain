name: DIGITRANS-SCM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend : Build + Test ──────────────────────────────────────
  backend-ci:
    name: Backend (Spring Boot + MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: digitrans_scm_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
          MYSQL_ROOT_PASSWORD: root_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u test_user -ptest_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/digitrans_scm_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Douala
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_pass
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: mvn clean verify -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  # ─── Frontend : Lint + Build ─────────────────────────────────────
  frontend-ci:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build

  # ─── Deploy to Staging (main only) ───────────────────────────────
  deploy-staging:
    name: Deploy → Staging AWS af-south-1
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Backend image
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG
          docker tag $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG \
                     $ECR_REGISTRY/digitrans-scm-backend:latest
          docker push $ECR_REGISTRY/digitrans-scm-backend:latest

      - name: Build & push Frontend image
        working-directory: ./frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/digitrans-scm-frontend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/digitrans-scm-frontend:$IMAGE_TAG
          docker tag $ECR_REGISTRY/digitrans-scm-frontend:$IMAGE_TAG \
                     $ECR_REGISTRY/digitrans-scm-frontend:latest
          docker push $ECR_REGISTRY/digitrans-scm-frontend:latest

      - name: Deploy to EC2 Staging
        # TODO: ssh into EC2 af-south-1, docker pull + restart containers
        run: echo "Deploy step — configure EC2 SSH secrets (EC2_HOST, EC2_SSH_KEY)"
