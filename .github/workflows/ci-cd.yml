name: DIGITRANS-SCM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  pull_request_target:
    branches: [main, develop]

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  BACKEND — Build only (tests désactivés — Milestone M2)
  # ═══════════════════════════════════════════════════════════════
  backend-ci:
    name: Backend (Spring Boot + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (tests désactivés — Milestone M2)
        working-directory: ./backend
        run: mvn -B clean package -DskipTests -Djacoco.skip=true

      - name: SonarCloud Analysis
        working-directory: ./backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.organization=wozewilfried \
            -Dsonar.projectKey=digitrans-scm \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  FRONTEND — conditionnel Milestone 3
  # ═══════════════════════════════════════════════════════════════
  frontend-ci:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend is initialized
        id: frontend-check
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package-lock.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Frontend absent — Milestone 3 (août 2026)"
          fi

      - name: Set up Node.js 20
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript type check
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build

      - name: Upload build artifact
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Frontend CI — placeholder (Milestone 3 pending)
        if: steps.frontend-check.outputs.exists == 'false'
        run: |
          echo "Frontend CI skipped — Milestone 3 not started (DONGMO — août 2026)"
          exit 0

  # ═══════════════════════════════════════════════════════════════
  #  DEPLOY → STAGING — AWS us-east-1
  #  Déclenché sur push main et sur PR ouverte vers main
  # ═══════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy → Staging AWS us-east-1
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      # ── Guard : vérifier que les secrets AWS sont bien configurés ──
      - name: Check AWS secrets are configured
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || \
             [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || \
             [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "=================================================="
            echo "  ⚠️  Secrets AWS manquants dans GitHub Secrets"
            echo "  Ajouter : AWS_ACCESS_KEY_ID"
            echo "            AWS_SECRET_ACCESS_KEY"
            echo "            AWS_ACCOUNT_ID"
            echo "  Settings → Secrets and variables → Actions"
            echo "=================================================="
            exit 1
          fi
          echo "✅ Secrets AWS présents"

      # ── 1. Credentials AWS ──────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ── 2. Login ECR ────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          echo "Checking ECR repository 'digitrans-scm-backend'..."
          if ! aws ecr describe-repositories --repository-names digitrans-scm-backend >/dev/null 2>&1; then
            echo "Repository not found — creating digitrans-scm-backend"
            aws ecr create-repository --repository-name digitrans-scm-backend --region us-east-1
          else
            echo "Repository exists"
          fi

      # ── 3. Build JAR + Push image Backend ───────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR (sans tests)
        working-directory: ./backend
        run: mvn -B clean package -DskipTests -Djacoco.skip=true

      - name: Build & push Backend Docker image
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG .

          # Ensure repository exists (race-safe) and retry push if repository was just created
          aws ecr describe-repositories --repository-names digitrans-scm-backend >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name digitrans-scm-backend --region us-east-1 || true

          for i in 1 2 3; do
            if docker push $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG; then
              break
            else
              echo "Push attempt $i failed, retrying in 3s..."
              sleep 3
            fi
          done

          docker tag $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG \
                         $ECR_REGISTRY/digitrans-scm-backend:latest

          for i in 1 2 3; do
            if docker push $ECR_REGISTRY/digitrans-scm-backend:latest; then
              break
            else
              echo "Push latest attempt $i failed, retrying in 3s..."
              sleep 3
            fi
          done

          echo "BACKEND_IMAGE=$ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG" >> $GITHUB_ENV

      # ── 4. Deploy sur EC2 via SSH ────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/digitrans_key
          chmod 600 ~/.ssh/digitrans_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/digitrans_key ubuntu@${{ secrets.EC2_HOST }} \
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" \
            AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}" \
            bash << 'ENDSSH'
            set -e
            echo "=== DIGITRANS-SCM Deploy $(date) ==="

            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS \
              --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com

            docker pull ${BACKEND_IMAGE}

            cd /opt/digitrans-scm
            sed -i "s|BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env

            docker compose up -d --no-deps --force-recreate backend
            docker image prune -f

            echo "=== Deploy terminé avec succès ==="
          ENDSSH

      # ── 5. Health check post-deploy ─────────────────────────
      - name: Health check
        run: |que 
          echo "Attente démarrage application (30s)..."
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}:8080/actuator/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check OK — application démarrée"
          else
            echo "⚠️  Health check: $HTTP_STATUS — vérifier les logs EC2"
          fi