name: DIGITRANS-SCM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  BACKEND — Build only (tests + JaCoCo désactivés — Milestone M2)
  # ═══════════════════════════════════════════════════════════════
  backend-ci:
    name: Backend (Spring Boot + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (tests désactivés — Milestone M2)
        working-directory: ./backend
        run: mvn -B clean package -DskipTests -Djacoco.skip=true

      - name: SonarCloud Analysis
        working-directory: ./backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.organization=wozewilfried \
            -Dsonar.projectKey=digitrans-scm \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  FRONTEND — Lint + Type check + Build
  #  (conditionnel : skippé si le dossier frontend n'existe pas encore)
  #  Milestone 3 — Échéance août 2026
  # ═══════════════════════════════════════════════════════════════
  frontend-ci:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend is initialized
        id: frontend-check
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package-lock.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Frontend détecté — exécution des checks CI"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Dossier frontend absent — Milestone 3 pas encore initialisé (échéance août 2026)"
          fi

      - name: Set up Node.js 20
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript type check
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build

      - name: Upload build artifact
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Frontend CI — placeholder success (Milestone 3 pending)
        if: steps.frontend-check.outputs.exists == 'false'
        run: |
          echo "=================================================="
          echo "  Frontend CI skipped — Milestone 3 not started  "
          echo "  Tasks 21-30 assigned to DONGMO — août 2026     "
          echo "=================================================="
          exit 0

  # ═══════════════════════════════════════════════════════════════
  #  DEPLOY → STAGING (main branch uniquement, après les 2 jobs CI)
  # ═══════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy → Staging AWS af-south-1
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Backend image
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG
          docker tag  $ECR_REGISTRY/digitrans-scm-backend:$IMAGE_TAG \
                      $ECR_REGISTRY/digitrans-scm-backend:latest
          docker push $ECR_REGISTRY/digitrans-scm-backend:latest

      - name: Build & push Frontend image
        if: ${{ hashFiles('frontend/Dockerfile') != '' }}
        working-directory: ./frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/digitrans-scm-frontend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/digitrans-scm-frontend:$IMAGE_TAG
          docker tag  $ECR_REGISTRY/digitrans-scm-frontend:$IMAGE_TAG \
                      $ECR_REGISTRY/digitrans-scm-frontend:latest
          docker push $ECR_REGISTRY/digitrans-scm-frontend:latest

      - name: Deploy to EC2 Staging
        # TODO Milestone 4 : ajouter EC2_HOST + EC2_SSH_KEY dans GitHub Secrets
        run: |
          echo "=================================================="
          echo "  SSH deploy step — Milestone 4 (sept 2026)      "
          echo "  Ajouter EC2_HOST et EC2_SSH_KEY dans les secrets"
          echo "=================================================="