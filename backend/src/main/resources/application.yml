spring:
  application:
    name: digitrans-scm

  # ─── MySQL ───────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/digitrans_scm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Douala&characterEncoding=UTF-8
    username: digitrans_user
    password: digitrans_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # ─── JPA / Hibernate ─────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_schema: digitrans_scm

  # ─── Flyway Migrations ───────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:mysql://localhost:3306/digitrans_scm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Douala
    user: digitrans_user
    password: digitrans_pass

  # ─── Redis Cache ─────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # ─── Cache ───────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes

# ─── Server ────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ─── JWT ───────────────────────────────────────────────────────────
jwt:
  secret: digitrans-scm-secret-key-agrocam-2026-very-long-and-secure
  expiration: 86400000         # 24 heures
  refresh-expiration: 604800000  # 7 jours

# ─── Swagger / OpenAPI ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: DIGITRANS-SCM API
    description: API REST du Module Supply Chain — Projet DIGITRANS-CM | AGROCAM S.A.
    version: 1.0.0

# ─── Logging ───────────────────────────────────────────────────────
logging:
  level:
    cm.camtech.digitrans: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ─── Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
